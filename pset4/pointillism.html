<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    // draw background
    ctx.fillStyle = "lightblue";
    ctx.fillRect(0, 0, w, h);


const numCircles = 256;
for (let i = 0; i < numCircles; i++){
        let xPos = Math.random() * w;
        let yPos = Math.random() * h;
        let radius = Math.random() * 7;
        
        ctx.beginPath();
        ctx.arc(xPos,
            yPos,
            radius,
            0,
            Math.PI * 2,
            true);
   
    let isAbove = yPos < h / 2;
        if (isAbove){
            ctx.fillStyle = "#519F98";
        } else {
            ctx.fillStyle = "purple";
        };
    ctx.fill();
};

</script>
