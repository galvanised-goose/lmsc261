<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    // draw background
    ctx.fillStyle = "lightblue";
    ctx.fillRect(0, 0, w, h);

let numCircles = prompt("How many circles do you want on display?");
const maxRadius = w * 0.45;
const radiusIncrement = maxRadius / numCircles;

const colours = [
    "#EF998D", "#F0AA75", "#EEBB61",
        "#E8776B", "#E678B2", "#C184D1", 
            "#77B1B6", "#65D0A0", "#66D69E"
];

for(let i = 0; i < numCircles; i++) {
    let xPos = w / 2;
    let yPos = h / 2;
    let radius = radiusIncrement * (i + 1);

    ctx.beginPath();
    ctx.arc(xPos,
        yPos,
        radius,
        0,
        Math.PI * 2,
        true
    );  
    ctx.lineWidth = 4;
    ctx.strokeStyle = colours[i % 8];
    ctx.stroke();
};


</script>
