<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    // draw background
    ctx.fillStyle = "lightblue";
    ctx.fillRect(0, 0, w, h);

    // coordinate variables
    const cx = w / 2, cy = h / 2
    const radiusA = w * 0.5, radiusB = radiusA / 2, radiusC = radiusB * 0.25

    //draw circle layer 1
    ctx.beginPath();
    ctx.arc(cx,            // simple circle
            cy,
            radiusA,
            0,
            Math.PI * 2,
            false);
        ctx.fillStyle = "black"; // yin body
        ctx.fill();

    // draw yang
    ctx.beginPath();
    ctx.arc(cx,         // yang head
            cy / 2,
            radiusB,
            Math.PI * 1.5,
            Math.PI * 0.5,
            false);
    ctx.arc(cx,         // yang tail
            cy * 1.5,
            radiusB,
            Math.PI * 1.5,
            Math.PI * 0.5,
            true);
    ctx.arc(cx,         // yang body
            cy,
            radiusA,
            Math.PI * 0.5,
            Math.PI * 1.5,
            false);
        ctx.fillStyle = "white"; // colour yang
        ctx.fill();
        ctx.strokeStyle = "black"; // outline yang
        ctx.lineWidth = 3
        ctx.stroke();

    // draw eyes
    ctx.beginPath();
    ctx.arc(cx,                 // yang eye
            cy / 2,
            radiusC,
            0,
            Math.PI * 2,
            false);
        ctx.fillStyle = "black"; // eye colour yang
        ctx.fill();
    ctx.beginPath();
    ctx.arc(cx,                 // yin eye
            cy * 1.5,
            radiusC,
            0,
            Math.PI * 2,
            false);
        ctx.fillStyle = "white" // eye colour yin
        ctx.fill();
</script>
